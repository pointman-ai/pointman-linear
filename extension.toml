# Linear on Pointman's machines (MB-343, Pointman's docs/dev/panes.md): a Linear team's board as a pane the
# apps draw with their own board, the same columns, cards and drag as Pointman's projects. A move, a rank or
# an edit goes to Linear, and the card settles where Linear puts it; Linear's no snaps it back with why.
# Linear is asked with the vault's API key (`/linear add`), from the node, so the apps never hold it.
[extension]
id = "linear"
name = "Linear"
version = "0.7.0"
publisher = "aurelio"
summary = "A Linear team's or project's board in the apps, drawn by Pointman's own board, with full control: every change goes to Linear."
node = ">=0.4.0"
platforms = ["macos-arm64", "macos-x86_64", "linux-x86_64", "linux-arm64"]

[run]
command = ["bin/linear"]
runtime = "binary"

[permissions]
network = true
secrets = ["linear.*"]           # each workspace's API key, kept in the vault as linear.<label>

# a Linear API key for every node: linear.app › Settings › Security & access › Personal API keys
[[credentials]]
id = "account"
title = "Linear API key"
help = "A personal API key from linear.app: Settings › Security & access › New API key. Pointman asks Linear as its owner."
item = "linear.{label}"
value = "lin_api_[A-Za-z0-9]{40}"
placeholder = "lin_api_…"
needed = 1

[settings]
type = "object"

[settings.properties.refresh_seconds]
type = "integer"
default = 30
description = "How often an open board asks Linear what changed"

[settings.properties.api_url]
type = "string"
default = "https://api.linear.app/graphql"
description = "Linear's GraphQL endpoint"

[[commands]]
kind = "linear.add"
title = "Add a Linear API key"
params = { type = "object", properties = { name = { type = "string", description = "What to call it (work): lowercase letters, digits, . _ -" } } }
slash = "add"
form = "account"
summary = "Add a Linear API key for every node"

# what a project can be connected to (Pointman's Project pane): the teams and the open Linear projects
# the key sees, each as the target the board opens by,
# {targets: [{target: {team} | {project}, name, key, kind: "team" | "project"}], text}
[[commands]]
kind = "linear.boards"
title = "List Linear boards"
params = { type = "object", properties = {} }
slash = "boards"
summary = "The Linear teams and projects whose boards can be connected"

# what an agent does with Linear itself, with the vault's keys: each is tried in turn (or the one `account` names), and
# a team or an issue is found with whichever key sees it
[[commands]]
kind = "linear.team"
title = "A team's states, people, labels and sprints"
params = { type = "object", required = ["team"], properties = { team = { type = "string", description = "The team's key (ALA)" }, account = { type = "string", description = "Which vault key to use (work, for linear.work); by default each key is tried" } }, additionalProperties = false }
summary = "What an issue on a team can be set to"

[[commands]]
kind = "linear.projects"
title = "List Linear projects"
params = { type = "object", properties = { account = { type = "string", description = "Which vault key to use (work, for linear.work); by default each key is tried" } }, additionalProperties = false }
summary = "The open Linear projects the keys see"

[[commands]]
kind = "linear.search"
title = "Search issues"
params = { type = "object", properties = { query = { type = "string", description = "Words in the title or description" }, team = { type = "string", description = "The team's key" }, state = { type = "string" }, owner = { type = "string", description = "A display name, or none" }, project = { type = "string", description = "A project's name or id" }, all = { type = "boolean", description = "Include completed and canceled issues" }, limit = { type = "integer", minimum = 1, maximum = 100, default = 25 }, account = { type = "string", description = "Which vault key to use (work, for linear.work); by default each key is tried" } }, additionalProperties = false }
summary = "Issues by words, team, state, owner or project; open ones unless all"

[[commands]]
kind = "linear.issue"
title = "Read an issue"
params = { type = "object", required = ["issue"], properties = { issue = { type = "string", description = "Its ref (ALA-12)" }, account = { type = "string", description = "Which vault key to use (work, for linear.work); by default each key is tried" } }, additionalProperties = false }
summary = "An issue with its description, comments and sub-issues"

[[commands]]
kind = "linear.create"
title = "File an issue"
params = { type = "object", required = ["team", "title"], properties = { team = { type = "string", description = "The team's key (ALA)" }, project = { type = "string", description = "A project's name or id" }, title = { type = "string" }, body = { type = "string", description = "Markdown" }, state = { type = "string", description = "One of the team's states (linear.team lists them)" }, owner = { type = ["string", "null"], description = "A person's display name (linear.team lists them); null clears it" }, priority = { type = "string", enum = ["urgent", "high", "normal", "low", "none"] }, target = { type = ["string", "null"], description = "Due date, YYYY-MM-DD; null clears it" }, estimate = { type = ["integer", "null"] }, labels = { type = "array", items = { type = "string" }, description = "Label names; replaces the issue's labels" }, sprint = { type = ["string", "null"], description = "A cycle's id, name or Cycle N; null clears it" }, parent = { type = ["string", "null"], description = "The parent issue's ref (ALA-12); null clears it" }, account = { type = "string", description = "Which vault key to use (work, for linear.work); by default each key is tried" } }, additionalProperties = false }
summary = "A new issue on a team"

[[commands]]
kind = "linear.update"
title = "Change an issue"
params = { type = "object", required = ["issue"], properties = { issue = { type = "string", description = "Its ref (ALA-12)" }, title = { type = "string" }, body = { type = "string", description = "Markdown" }, state = { type = "string", description = "One of the team's states (linear.team lists them)" }, owner = { type = ["string", "null"], description = "A person's display name (linear.team lists them); null clears it" }, priority = { type = "string", enum = ["urgent", "high", "normal", "low", "none"] }, target = { type = ["string", "null"], description = "Due date, YYYY-MM-DD; null clears it" }, estimate = { type = ["integer", "null"] }, labels = { type = "array", items = { type = "string" }, description = "Label names; replaces the issue's labels" }, sprint = { type = ["string", "null"], description = "A cycle's id, name or Cycle N; null clears it" }, parent = { type = ["string", "null"], description = "The parent issue's ref (ALA-12); null clears it" }, account = { type = "string", description = "Which vault key to use (work, for linear.work); by default each key is tried" } }, additionalProperties = false }
summary = "Change an issue's fields; only those given change"

[[commands]]
kind = "linear.comment"
title = "Comment on an issue"
params = { type = "object", required = ["issue", "body"], properties = { issue = { type = "string", description = "Its ref (ALA-12)" }, body = { type = "string", description = "Markdown" }, account = { type = "string", description = "Which vault key to use (work, for linear.work); by default each key is tried" } }, additionalProperties = false }
summary = "A comment on an issue"

# a team's or a Linear project's board (Pointman's docs/dev/panes.md, "Boards"): opened with {team: key}
# or {project: id}, a connected project's target, from those linear.boards lists
[[panes]]
id = "board"
title = "Linear"
format = "board"
opens = ["command"]
targets = "linear.boards"
