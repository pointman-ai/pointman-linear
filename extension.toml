# Linear on Pointman's machines (MB-343, Pointman's docs/dev/panes.md): a Linear team's board as a pane the
# apps draw with their own board, the same columns, cards and drag as Pointman's projects. A move, a rank or
# an edit goes to Linear, and the card settles where Linear puts it; Linear's no snaps it back with why.
# Linear is asked with the vault's API key (`/linear add`), from the node, so the apps never hold it.
[extension]
id = "linear"
name = "Linear"
version = "0.5.2"
publisher = "aurelio"
summary = "A Linear team's or project's board in the apps, drawn by Pointman's own board, with full control: every change goes to Linear."
node = ">=0.2.0"
platforms = ["macos-arm64", "macos-x86_64", "linux-x86_64", "linux-arm64"]

[run]
command = ["bin/linear"]
runtime = "binary"

[permissions]
network = true
secrets = ["linear.*"]           # each workspace's API key, kept in the vault as linear.<label>

# a Linear API key for every node: linear.app › Settings › Security & access › Personal API keys
[[credentials]]
id = "account"
title = "Linear API key"
help = "A personal API key from linear.app: Settings › Security & access › New API key. Pointman asks Linear as its owner."
item = "linear.{label}"
value = "lin_api_[A-Za-z0-9]{40}"
placeholder = "lin_api_…"
needed = 1

[settings]
type = "object"

[settings.properties.refresh_seconds]
type = "integer"
default = 30
description = "How often an open board asks Linear what changed"

[settings.properties.api_url]
type = "string"
default = "https://api.linear.app/graphql"
description = "Linear's GraphQL endpoint"

[[commands]]
kind = "linear.add"
title = "Add a Linear API key"
params = { type = "object", properties = { name = { type = "string", description = "What to call it (work): lowercase letters, digits, . _ -" } } }
slash = "add"
form = "account"
summary = "Add a Linear API key for every node"

# what a project can be connected to (Pointman's Project pane): the teams and the open Linear projects
# the key sees, each as the target the board opens by,
# {targets: [{target: {team} | {project}, name, key, kind: "team" | "project"}], text}
[[commands]]
kind = "linear.boards"
title = "List Linear boards"
params = { type = "object", properties = {} }
slash = "boards"
summary = "The Linear teams and projects whose boards can be connected"

# a team's or a Linear project's board (Pointman's docs/dev/panes.md, "Boards"): opened with {team: key}
# or {project: id}, a connected project's target, from those linear.boards lists
[[panes]]
id = "board"
title = "Linear"
format = "board"
opens = ["command"]
targets = "linear.boards"
